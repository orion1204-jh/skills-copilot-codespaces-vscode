<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White House 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL viewport; a plan-map card bottom-left, a light & motion pill bottom-right. */
  :root {
    --ink: #1c2a3a;
    --ink-soft: rgba(28, 42, 58, 0.52);
    --glass: rgba(250, 251, 252, 0.62);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --glass-shadow: 0 10px 30px rgba(20, 32, 48, 0.16), 0 1px 2px rgba(20, 32, 48, 0.08);
    --chip: #ffffff;
    --plan-house: #1c2a3a;
    --plan-line: rgba(28, 42, 58, 0.28);
    --plan-lawn: rgba(76, 112, 52, 0.16);
    --cone: rgba(28, 42, 58, 0.22);
    --accent: #a8834a;
    --veil: #dfe7ee;
    --display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --text: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  body.night {
    --ink: #e9eef5;
    --ink-soft: rgba(233, 238, 245, 0.5);
    --glass: rgba(14, 20, 30, 0.5);
    --glass-edge: rgba(255, 255, 255, 0.12);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --chip: rgba(255, 255, 255, 0.16);
    --plan-house: #f2e6c9;
    --plan-line: rgba(233, 238, 245, 0.22);
    --plan-lawn: rgba(120, 150, 110, 0.12);
    --cone: rgba(242, 222, 170, 0.26);
    --accent: #e3c27e;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--veil);
    color: var(--ink);
    font-family: var(--text);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .glass {
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(18px) saturate(1.5);
    -webkit-backdrop-filter: blur(18px) saturate(1.5);
    transition: background 0.8s ease, border-color 0.8s ease, color 0.8s ease;
  }

  .mark {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: max(22px, calc(env(safe-area-inset-left, 0px) + 18px));
    pointer-events: none;
    color: #fff;
    text-shadow: 0 1px 12px rgba(10, 20, 35, 0.35);
    display: grid;
    gap: 2px;
  }
  .mark h1 {
    margin: 0;
    font: 600 26px/1.05 var(--display);
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  .mark p {
    margin: 0;
    font: 500 10.5px/1.4 var(--text);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.82;
    font-variant-numeric: tabular-nums;
  }

  .hud {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }
  .hud.left { left: max(18px, calc(env(safe-area-inset-left, 0px) + 14px)); }
  .hud.right { right: max(18px, calc(env(safe-area-inset-right, 0px) + 14px)); }

  .plan { border-radius: 22px; padding: 8px; width: 168px; height: 168px; box-sizing: border-box; }
  .plan svg { width: 100%; height: 100%; display: block; overflow: hidden; border-radius: 14px; }
  .plan .lawn { fill: var(--plan-lawn); }
  .plan .drive { fill: none; stroke: var(--plan-line); stroke-width: 2.2; stroke-linecap: round; }
  .plan .fence { fill: none; stroke: var(--plan-line); stroke-width: 1; stroke-dasharray: 1.5 2.5; }
  .plan .house { fill: var(--plan-house); transition: fill 0.8s ease; }
  .plan .pool { fill: none; stroke: var(--plan-line); stroke-width: 1.4; }
  .plan .cone { fill: var(--cone); transition: fill 0.8s ease; }
  .plan .eye { fill: var(--ink); }
  .plan .spot { cursor: pointer; }
  .plan .spot circle.hit { fill: transparent; }
  .plan .spot circle.dot { fill: var(--glass); stroke: var(--ink); stroke-width: 1.4; transition: fill 0.25s ease, r 0.25s ease; }
  .plan .spot:hover circle.dot, .plan .spot:focus-visible circle.dot { fill: var(--accent); }
  .plan .spot.on circle.dot { fill: var(--accent); stroke: var(--accent); }
  .plan .spot:focus { outline: none; }

  .pill { border-radius: 999px; padding: 5px; display: flex; align-items: center; gap: 4px; }
  .seg { position: relative; display: flex; gap: 2px; }
  .seg .thumb {
    position: absolute; top: 0; left: 0; width: 44px; height: 44px; border-radius: 999px;
    background: var(--chip);
    box-shadow: 0 2px 8px rgba(20, 32, 48, 0.14);
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1), background 0.8s ease;
  }
  .btn {
    position: relative;
    width: 44px; height: 44px;
    border: 0; border-radius: 999px; padding: 0;
    background: transparent;
    color: var(--ink-soft);
    display: grid; place-items: center;
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease;
  }
  .btn:hover { color: var(--ink); }
  .btn[aria-pressed="true"], .btn.on { color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn.toggle[aria-pressed="true"] { background: var(--chip); box-shadow: 0 2px 8px rgba(20, 32, 48, 0.14); }
  .btn.toggle[aria-pressed="true"] svg.spin { animation: spin 6s linear infinite; }
  .rule { width: 1px; height: 24px; background: var(--ink-soft); opacity: 0.35; margin: 0 4px; }

  #veil {
    position: fixed; inset: 0;
    background: radial-gradient(120% 90% at 50% 100%, #f5efe6 0%, #dfe7ee 55%, #c7d6e4 100%);
    display: grid; place-items: center;
    transition: opacity 1.2s ease 0.2s;
    z-index: 5;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil .inner { display: grid; justify-items: center; gap: 18px; color: #1c2a3a; }
  #veil svg { width: 120px; height: auto; opacity: 0.9; }
  #veil .bar { width: 140px; height: 2px; background: rgba(28, 42, 58, 0.12); border-radius: 2px; overflow: hidden; }
  #veil .bar i { display: block; height: 100%; width: 0%; background: #1c2a3a; transition: width 0.3s ease; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    .plan { width: 128px; height: 128px; border-radius: 18px; }
    .btn { width: 40px; height: 40px; }
    .seg .thumb { width: 40px; height: 40px; }
    .mark h1 { font-size: 22px; }
    .hud.right { bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); }
    .hud.right .pill { flex-direction: column; }
    .hud.right .seg { flex-direction: column; }
    .hud.right .rule { width: 24px; height: 1px; margin: 4px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .seg .thumb, #veil { transition: none; }
    .btn.toggle[aria-pressed="true"] svg.spin { animation: none; }
  }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D model of the White House"></canvas>

<div class="mark" id="mark">
  <h1>The White House</h1>
  <p>38.8977° N · 77.0365° W</p>
</div>

<div class="hud left">
  <nav class="plan glass" aria-label="Viewpoints">
    <svg id="plan" viewBox="-80 -80 160 160" role="group">
      <rect class="lawn" x="-70" y="-56" width="140" height="132" rx="10"></rect>
      <path class="fence" d="M -70 -56 H 70 M -70 76 H 70"></path>
      <path id="plan-drives" class="drive" d=""></path>
      <circle id="plan-nf" class="pool" r="3"></circle>
      <circle id="plan-sf" class="pool" r="4.2"></circle>
      <path id="plan-cone" class="cone" d=""></path>
      <path id="plan-house" class="house" d=""></path>
      <g id="plan-spots"></g>
      <circle id="plan-eye" class="eye" r="2.4"></circle>
    </svg>
  </nav>
</div>

<div class="hud right">
  <div class="pill glass">
    <div class="seg" id="light" role="radiogroup" aria-label="Light">
      <span class="thumb" aria-hidden="true"></span>
      <button class="btn" role="radio" data-light="day" aria-label="Day" aria-checked="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
      <button class="btn" role="radio" data-light="golden" aria-label="Golden hour" aria-checked="false">
        <svg viewBox="0 0 24 24"><path d="M7 16a5 5 0 0 1 10 0"/><path d="M2.5 16h19M5 20h14M12 6.5v2.2M4.6 9.6l1.5 1.5M19.4 9.6l-1.5 1.5"/></svg>
      </button>
      <button class="btn" role="radio" data-light="night" aria-label="Night" aria-checked="false">
        <svg viewBox="0 0 24 24"><path d="M19.5 14.8A8 8 0 0 1 9.2 4.5a8 8 0 1 0 10.3 10.3z"/><path d="M17 3.5v2.5M15.75 4.75h2.5" stroke-width="1.3"/></svg>
      </button>
    </div>
    <span class="rule" aria-hidden="true"></span>
    <button class="btn toggle" id="orbit" aria-label="Orbit" aria-pressed="false">
      <svg class="spin" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5v4h-4"/></svg>
    </button>
    <button class="btn" id="full" aria-label="Full screen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div id="veil" aria-hidden="true">
  <div class="inner">
    <svg viewBox="0 0 120 52"><g fill="none" stroke="#1c2a3a" stroke-width="1.2"><path d="M8 46h104M14 46V22h92v24M14 22h92M10 22l2-4h96l2 4M42 18l18-9 18 9"/><path d="M45 46V22M53 46V22M67 46V22M75 46V22"/><path d="M22 28v6M30 28v6M90 28v6M98 28v6M22 38v6M30 38v6M90 38v6M98 38v6"/></g></svg>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
